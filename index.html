<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYPAY 簽名檔產生器</title>
<style>
  :root {
    --brand: #0C63C4; --ink: #0E5A8A; --muted: #5b6b7c;
    --line: #d7dee6; --bg: #f3f6f9; --ok: #1b7f3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: #1f3f5f; line-height: 1.5;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; color: var(--ink); }
  .sub { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 5px; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=email], input[type=tel], input[type=url] {
    width: 100%; padding: 9px 11px; font-size: 14px; font-family: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 6px; color: #1f3f5f; margin-bottom: 14px;
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
  .check { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; margin-bottom: 14px; }
  .check input { margin-top: 3px; }
  .check label { margin: 0; font-weight: 600; }
  .divider { border: 0; border-top: 1px solid var(--line); margin: 6px 0 18px; }

  .preview-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .toggle button { border: 0; background: #fff; color: var(--muted); font-size: 13px; padding: 7px 14px; cursor: pointer; font-family: inherit; }
  .toggle button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .stage-box { border: 1px dashed var(--line); border-radius: 6px; padding: 16px; background: #fff; overflow-x: auto; }
  #stage { margin: 0 auto; }
  #stage.mobile { width: 360px; border: 1px solid var(--line); padding: 10px; border-radius: 6px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .actions button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 6px; cursor: pointer; border: 1px solid var(--brand); }
  .actions .primary { background: var(--brand); color: #fff; }
  .actions .secondary { background: #fff; color: var(--brand); }
  button:focus-visible { outline: 2px solid #1f3f5f; outline-offset: 2px; }
  .status { font-size: 13px; color: var(--ok); min-height: 20px; }
  .steps { margin: 18px 0 0; padding-left: 20px; font-size: 14px; color: var(--muted); }
  .steps li { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SKYPAY 簽名檔產生器</h1>
  <p class="sub">填好資料後按「複製簽名檔」，貼到 Gmail 簽名欄即可。</p>

  <div class="layout">
    <div class="panel">
      <h2>個人資料</h2>
      <label for="name">姓名</label>
      <input type="text" id="name" value="Samuel Chan" autocomplete="name">

      <label for="title">職稱</label>
      <input type="text" id="title" value="Founder &amp; CEO" autocomplete="organization-title">

      <label for="email">Email</label>
      <input type="email" id="email" value="samuel.chan@skypay.ph" autocomplete="email">

      <label for="phone1">電話 1</label>
      <input type="tel" id="phone1" value="+886 989886418" autocomplete="tel">

      <label for="phone2">電話 2 <span class="hint">（選填）</span></label>
      <input type="tel" id="phone2" value="+63 9399027848">

      <hr class="divider">
      <h2>選項</h2>

      <label for="logo">Logo 圖片網址</label>
      <input type="url" id="logo" value="https://skypay.ph/assets/image/skypay_logo.png">

      <div class="check">
        <input type="checkbox" id="showAddr">
        <label for="showAddr">顯示底部藍色地址列</label>
      </div>
    </div>

    <div class="panel">
      <div class="preview-head">
        <h2 style="margin:0;">預覽</h2>
        <div class="toggle">
          <button id="viewDesktop" aria-pressed="true">電腦</button>
          <button id="viewMobile" aria-pressed="false">手機 360px</button>
        </div>
      </div>

      <div class="stage-box">
        <div id="stage"><div id="preview"></div></div>
      </div>

      <div class="actions">
        <button class="primary" id="copyRich">複製簽名檔</button>
        <button class="secondary" id="copyCode">複製 HTML 原始碼</button>
        <span class="status" id="status" role="status"></span>
      </div>
      <ol class="steps">
        <li>按「複製簽名檔」。</li>
        <li>Gmail：設定 → 查看所有設定 → 一般 → 簽名，貼上後捲到最底儲存。</li>
        <li>寄一封測試信，用電腦與手機各看一次。</li>
      </ol>
    </div>
  </div>
</div>

<script>
  // ===== 公司固定資訊：要修改請改這裡 =====
  const COMPANY = {
    website: "https://www.skypay.ph/",
    websiteLabel: "www.skypay.ph",
    logoAlt: "SKYPAY - Your Payment Bridge",
    logoRatio: 87 / 200, // 依實際 Logo 比例，用來計算 height 屬性
    address: "Unit T-2902, 29th floor SM Mega Tower, Wack-Wack Greenhills, Mandaluyong, Metro Manila, Philippines, 1555"
  };
  const C = { text: "#0E5A8A", rule: "#0C63C4", bar: "#1565c0", barAccent: "#29A3E3" };
  const FONT = "Arial, Helvetica, sans-serif";
  const MAXW = 600;
  const LOGO_W = 180;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const telHref = (s) => "tel:" + s.replace(/[^\d+]/g, "");
  const link = (href, text, extra) =>
    `<a href="${esc(href)}" style="color:${C.text}; text-decoration:none;${extra || ""}" target="_blank">${esc(text)}</a>`;

  function contactRow(label, valueHtml) {
    return `<tr>
          <td width="48" valign="top" style="width:48px; padding:3px 0; font-family:${FONT}; font-size:14px; line-height:20px; font-weight:bold; color:${C.text}; white-space:nowrap;">${label}</td>
          <td valign="top" style="padding:3px 0; font-family:${FONT}; font-size:14px; line-height:20px; color:${C.text}; word-break:break-word;">${valueHtml}</td>
        </tr>`;
  }

  function infoBlock(d) {
    const ps = [d.phone1, d.phone2].map(s => s.trim()).filter(Boolean);
    // 每組號碼各自 nowrap，號碼之間可換行
    const phoneHtml = ps
      .map(p => link(telHref(p), p, " white-space:nowrap;"))
      .join('<span style="color:#9bb0c4;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>');

    const rows = [
      d.email.trim() ? contactRow("Email:", link("mailto:" + d.email.trim(), d.email.trim())) : "",
      ps.length ? contactRow("Tel:", phoneHtml) : "",
      contactRow("Web:", link(COMPANY.website, COMPANY.websiteLabel))
    ].join("");

    return `<div style="font-family:${FONT}; font-size:21px; line-height:25px; font-weight:bold; letter-spacing:0.3px; color:${C.text};">${esc(d.name.trim().toUpperCase())}</div>
      <div style="margin-top:3px; font-family:${FONT}; font-size:12px; line-height:18px; letter-spacing:1.2px; color:${C.text};">${esc(d.title.trim().toUpperCase())}</div>
      <table cellpadding="0" cellspacing="0" border="0" width="42" style="width:42px; border-collapse:collapse; margin-top:10px;">
        <tr><td height="2" style="height:2px; line-height:2px; font-size:2px; background-color:${C.rule};">&nbsp;</td></tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; margin-top:15px;">${rows}</table>`;
  }

  function logoBlock(d) {
    const h = Math.round(LOGO_W * COMPANY.logoRatio);
    return `<a href="${esc(COMPANY.website)}" style="text-decoration:none; border:0;" target="_blank"><img src="${esc(d.logo.trim())}" alt="${esc(COMPANY.logoAlt)}" width="${LOGO_W}" height="${h}" style="display:block; width:${LOGO_W}px; height:auto; max-width:100%; border:0; background:#ffffff;"></a>`;
  }

  function addressBar() {
    return `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse;">
    <tr>
      <td valign="middle" style="background-color:${C.bar}; padding:9px 20px; font-family:${FONT}; font-size:12px; line-height:16px; color:#ffffff;">${esc(COMPANY.address)}</td>
      <td width="34" style="width:34px; background-color:${C.barAccent}; font-size:0; line-height:0;">&nbsp;</td>
    </tr>
  </table>`;
  }

  function buildSignature(d) {
    const addr = d.showAddr ? `
  <tr><td style="padding:0;">${addressBar()}</td></tr>` : "";

    // 流體混合排版：inline-block 負責 Gmail／Apple Mail，align="left" 負責 Outlook
    return `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; max-width:${MAXW}px; border-collapse:collapse; background-color:#ffffff;">
  <tr>
    <td style="padding:0;">
      <table cellpadding="0" cellspacing="0" border="0" align="left" width="100%" style="display:inline-block; vertical-align:middle; width:100%; max-width:372px; min-width:270px; border-collapse:collapse;">
        <tr><td style="padding:24px 10px 12px 24px;">${infoBlock(d)}</td></tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" align="left" width="100%" style="display:inline-block; vertical-align:middle; width:100%; max-width:212px; border-collapse:collapse;">
        <tr><td align="center" style="padding:12px 24px 24px 16px;">${logoBlock(d)}</td></tr>
      </table>
    </td>
  </tr>${addr}
</table>`;
  }

  const fields = ["name", "title", "email", "phone1", "phone2", "logo"];
  let data = {}, mobile = false;

  function readData() {
    data = {};
    fields.forEach(f => data[f] = $(f).value);
    data.showAddr = $("showAddr").checked;
  }
  const currentHtml = () => buildSignature(data);

  function render() {
    readData();
    $("stage").className = mobile ? "mobile" : "";
    $("stage").style.width = mobile ? "360px" : "100%";
    $("viewMobile").setAttribute("aria-pressed", String(mobile));
    $("viewDesktop").setAttribute("aria-pressed", String(!mobile));
    $("preview").innerHTML = currentHtml();
  }

  function flash(msg) {
    $("status").textContent = msg;
    clearTimeout(flash.t);
    flash.t = setTimeout(() => $("status").textContent = "", 3000);
  }

  function copyBySelection() {
    const range = document.createRange();
    range.selectNode($("preview"));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand("copy");
    sel.removeAllRanges();
    return ok;
  }

  $("copyRich").addEventListener("click", async () => {
    const html = currentHtml();
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([$("preview").innerText], { type: "text/plain" })
        })]);
        flash("已複製，可以貼到 Gmail 了");
        return;
      }
    } catch (e) { /* 改用備援做法 */ }
    flash(copyBySelection() ? "已複製，可以貼到 Gmail 了" : "複製失敗，請手動選取預覽區塊複製");
  });

  $("copyCode").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(currentHtml());
      flash("已複製 HTML 原始碼");
    } catch (e) {
      flash("複製失敗，請確認網頁是用 https 開啟");
    }
  });

  $("viewDesktop").addEventListener("click", () => { mobile = false; render(); });
  $("viewMobile").addEventListener("click", () => { mobile = true; render(); });
  fields.forEach(f => $(f).addEventListener("input", render));
  $("showAddr").addEventListener("change", render);
  render();
</script>
</body>
</html>
