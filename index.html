<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYPAY Email Signature Generator</title>
<style>
  :root {
    --brand: #0C63C4; --ink: #0E5A8A; --muted: #5b6b7c;
    --line: #d7dee6; --bg: #f3f6f9; --ok: #1b7f3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: #1f3f5f; line-height: 1.5;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: 24px; margin: 0 0 4px; color: var(--ink); }
  .sub { margin: 0; color: var(--muted); font-size: 14px; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; flex-shrink: 0; }
  .lang button { border: 0; background: #fff; color: var(--muted); font-size: 13px; padding: 7px 13px; cursor: pointer; font-family: inherit; }
  .lang button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 5px; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=email], input[type=tel] {
    width: 100%; padding: 9px 11px; font-size: 14px; font-family: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 6px; color: #1f3f5f; margin-bottom: 14px;
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }

  .preview-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .toggle button { border: 0; background: #fff; color: var(--muted); font-size: 13px; padding: 7px 14px; cursor: pointer; font-family: inherit; }
  .toggle button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .stage-box { border: 1px dashed var(--line); border-radius: 6px; padding: 16px; background: #fff; overflow-x: auto; }
  #stage { margin: 0 auto; }
  #stage.mobile { width: 360px; border: 1px solid var(--line); padding: 10px; border-radius: 6px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .actions button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 6px; cursor: pointer; border: 1px solid var(--brand); }
  .actions .primary { background: var(--brand); color: #fff; }
  .actions .secondary { background: #fff; color: var(--brand); }
  button:focus-visible { outline: 2px solid #1f3f5f; outline-offset: 2px; }
  .status { font-size: 13px; color: var(--ok); min-height: 20px; }
  .steps { margin: 18px 0 0; padding-left: 20px; font-size: 14px; color: var(--muted); }
  .steps li { margin-bottom: 4px; }

  /* 報時台詞：額外功能，低調呈現。沒有成功產生就整個不顯示（hidden 屬性）。 */
  .quip {
    margin: 40px 0 0; text-align: center;
    font-size: 12px; line-height: 1.7; color: var(--muted); opacity: .7;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="t-title">SKYPAY Email Signature Generator</h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">English</button>
      <button data-lang="zh-Hant" aria-pressed="false">正體中文</button>
      <button data-lang="zh-Hans" aria-pressed="false">简体中文</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <h2 id="t-formHead"></h2>

      <label for="name" id="t-lblName"></label>
      <input type="text" id="name" value="Samuel Chan" autocomplete="name">

      <label for="title" id="t-lblTitle"></label>
      <input type="text" id="title" value="Founder &amp; CEO" autocomplete="organization-title">

      <label for="email" id="t-lblEmail"></label>
      <input type="email" id="email" value="samuel.chan@skypay.ph" autocomplete="email">

      <label for="phone1" id="t-lblPhone1"></label>
      <input type="tel" id="phone1" value="+886 989886418" autocomplete="tel">

      <label for="phone2" id="t-lblPhone2"></label>
      <input type="tel" id="phone2" value="+63 9399027848">
    </div>

    <div class="panel">
      <div class="preview-head">
        <h2 style="margin:0;" id="t-prevHead"></h2>
        <div class="toggle">
          <button id="viewDesktop" aria-pressed="true"></button>
          <button id="viewMobile" aria-pressed="false"></button>
        </div>
      </div>

      <div class="stage-box">
        <div id="stage"><div id="preview"></div></div>
      </div>

      <div class="actions">
        <button class="primary" id="copyRich"></button>
        <button class="secondary" id="copyCode"></button>
        <span class="status" id="status" role="status"></span>
      </div>
      <ol class="steps">
        <li id="t-step1"></li>
        <li id="t-step2"></li>
        <li id="t-step3"></li>
      </ol>
    </div>
  </div>

  <p class="quip" id="quip" hidden></p>
</div>

<script>
  // ===== 公司固定資訊：要修改請改這裡 =====
  const COMPANY = {
    website: "https://www.skypay.ph/",
    websiteLabel: "www.skypay.ph",
    // logoPath 可以直接填完整網址，也可以填相對路徑（此時由 logoBase 組成絕對網址）。
    // 郵件沒有「所在網域」可以參照，所以輸出一定要絕對網址。
    logoPath: "https://ci3.googleusercontent.com/mail-sig/AIorK4x9bxN6cln7E8fMLrkvxIfqVljkmQt6EMJTQ8neprHxNkVjB5MupP6Wlqf5jopGrzSolcclAUyP81MF",
    logoBase: "https://seth-craftai.github.io/email-signature/", // 只有 logoPath 是相對路徑時才會用到
    logoAlt: "SKYPAY - Your Payment Bridge",
    logoRatio: 87 / 200, // 後備值；圖片載入成功時會換成實際比例
    address: "Unit T-2902, 29th floor SM Mega Tower, Wack-Wack Greenhills, Mandaluyong, Metro Manila, Philippines, 1555"
  };
  const C = { text: "#0E5A8A", rule: "#0C63C4", bar: "#1565c0", barAccent: "#29A3E3" };
  const FONT = "Arial, Helvetica, sans-serif";
  const MAXW = 600;
  const LOGO_W = 180;

  // ===== 介面文字（簽名檔內容不受影響，永遠是英文）=====
  const I18N = {
    "en": {
      htmlLang: "en",
      docTitle: "SKYPAY Email Signature Generator",
      title: "SKYPAY Email Signature Generator",
      sub: "Fill in your details, click Copy signature, then paste it into Gmail.",
      formHead: "Your details",
      name: "Full name", jobTitle: "Job title", email: "Email",
      phone1: "Phone 1", phone2: "Phone 2", optional: "(optional)",
      prevHead: "Preview", desktop: "Desktop", mobile: "Mobile 360px",
      copyRich: "Copy signature", copyCode: "Copy HTML source",
      okRich: "Copied. Paste it into Gmail.",
      okCode: "HTML source copied.",
      failRich: "Copy failed. Select the preview manually and copy.",
      failCode: "Copy failed. Make sure the page is served over https.",
      step1: "Click Copy signature.",
      step2: "In Gmail: Settings → See all settings → General → Signature. Paste, then scroll down and save.",
      step3: "Send yourself a test email and check it on both desktop and phone."
    },
    "zh-Hant": {
      htmlLang: "zh-Hant",
      docTitle: "SKYPAY 簽名檔產生器",
      title: "SKYPAY 簽名檔產生器",
      sub: "填好資料後按「複製簽名檔」，貼到 Gmail 簽名欄即可。",
      formHead: "個人資料",
      name: "姓名", jobTitle: "職稱", email: "Email",
      phone1: "電話 1", phone2: "電話 2", optional: "（選填）",
      prevHead: "預覽", desktop: "電腦", mobile: "手機 360px",
      copyRich: "複製簽名檔", copyCode: "複製 HTML 原始碼",
      okRich: "已複製，可以貼到 Gmail 了",
      okCode: "已複製 HTML 原始碼",
      failRich: "複製失敗，請手動選取預覽區塊複製",
      failCode: "複製失敗，請確認網頁是用 https 開啟",
      step1: "按「複製簽名檔」。",
      step2: "Gmail：設定 → 查看所有設定 → 一般 → 簽名，貼上後捲到最底儲存。",
      step3: "寄一封測試信，用電腦與手機各看一次。"
    },
    "zh-Hans": {
      htmlLang: "zh-Hans",
      docTitle: "SKYPAY 签名档生成器",
      title: "SKYPAY 签名档生成器",
      sub: "填好资料后点击「复制签名档」，粘贴到 Gmail 签名栏即可。",
      formHead: "个人资料",
      name: "姓名", jobTitle: "职称", email: "Email",
      phone1: "电话 1", phone2: "电话 2", optional: "（选填）",
      prevHead: "预览", desktop: "电脑", mobile: "手机 360px",
      copyRich: "复制签名档", copyCode: "复制 HTML 源代码",
      okRich: "已复制，可以粘贴到 Gmail 了",
      okCode: "已复制 HTML 源代码",
      failRich: "复制失败，请手动选取预览区块复制",
      failCode: "复制失败，请确认网页是用 https 打开",
      step1: "点击「复制签名档」。",
      step2: "Gmail：设置 → 查看所有设置 → 常规 → 签名，粘贴后滚动到最下方保存。",
      step3: "发一封测试邮件，用电脑和手机各看一次。"
    }
  };
  const DEFAULT_LANG = "en";
  let lang = DEFAULT_LANG;
  const T = () => I18N[lang];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const telHref = (s) => "tel:" + s.replace(/[^\d+]/g, "");
  const link = (href, text, extra) =>
    `<a href="${esc(href)}" style="color:${C.text}; text-decoration:none;${extra || ""}" target="_blank">${esc(text)}</a>`;

  function contactRow(label, valueHtml) {
    return `<tr>
          <td width="48" valign="top" style="width:48px; padding:3px 0; font-family:${FONT}; font-size:14px; line-height:20px; font-weight:bold; color:${C.text}; white-space:nowrap;">${label}</td>
          <td valign="top" style="padding:3px 0; font-family:${FONT}; font-size:14px; line-height:20px; color:${C.text}; word-break:break-word;">${valueHtml}</td>
        </tr>`;
  }

  function infoBlock(d) {
    const ps = [d.phone1, d.phone2].map(s => s.trim()).filter(Boolean);
    // 每組號碼各自 nowrap，號碼之間可換行
    const phoneHtml = ps
      .map(p => link(telHref(p), p, " white-space:nowrap;"))
      .join('<span style="color:#9bb0c4;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>');

    const rows = [
      d.email.trim() ? contactRow("Email:", link("mailto:" + d.email.trim(), d.email.trim())) : "",
      ps.length ? contactRow("Tel:", phoneHtml) : "",
      contactRow("Web:", link(COMPANY.website, COMPANY.websiteLabel))
    ].join("");

    return `<div style="font-family:${FONT}; font-size:21px; line-height:25px; font-weight:bold; letter-spacing:0.3px; color:${C.text};">${esc(d.name.trim().toUpperCase())}</div>
      <div style="margin-top:3px; font-family:${FONT}; font-size:12px; line-height:18px; letter-spacing:1.2px; color:${C.text};">${esc(d.title.trim().toUpperCase())}</div>
      <table cellpadding="0" cellspacing="0" border="0" width="42" style="width:42px; border-collapse:collapse; margin-top:10px;">
        <tr><td height="2" style="height:2px; line-height:2px; font-size:2px; background-color:${C.rule};">&nbsp;</td></tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; margin-top:15px;">${rows}</table>`;
  }

  // 預覽用相對路徑（同一個網站下才讀得到），輸出一律用絕對網址。
  function logoUrl(forPreview) {
    if (/^https?:\/\//i.test(COMPANY.logoPath)) return COMPANY.logoPath; // 已經是絕對網址
    const path = COMPANY.logoPath.replace(/^\/+/, "");  // 開頭不能有斜線
    if (forPreview) return path;
    const base = COMPANY.logoBase.replace(/\/*$/, "/"); // 結尾一定要有斜線
    try { return new URL(path, base).href; } catch (e) { return base + path; }
  }

  function logoBlock(forPreview) {
    const h = Math.round(LOGO_W * COMPANY.logoRatio);
    return `<a href="${esc(COMPANY.website)}" style="text-decoration:none; border:0;" target="_blank"><img src="${esc(logoUrl(forPreview))}" alt="${esc(COMPANY.logoAlt)}" width="${LOGO_W}" height="${h}" style="display:block; width:${LOGO_W}px; height:auto; max-width:100%; border:0; background:#ffffff;"></a>`;
  }

  function addressBar() {
    return `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse;">
    <tr>
      <td valign="middle" style="background-color:${C.bar}; padding:9px 20px; font-family:${FONT}; font-size:12px; line-height:16px; color:#ffffff;">${esc(COMPANY.address)}</td>
      <td width="34" style="width:34px; background-color:${C.barAccent}; font-size:0; line-height:0;">&nbsp;</td>
    </tr>
  </table>`;
  }

  function buildSignature(d, forPreview) {
    // 流體混合排版：兩個 inline-block 以 vertical-align:middle 對齊，寬度不足時 Logo 自動掉到下一行。
    // 兩個 table 之間不可留空白字元，否則會多出一道縫。
    // Logo 垂直位置：加大 padding 第一個數字往下移，同時把第三個數字減掉相同的量。
    return `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; max-width:${MAXW}px; border-collapse:collapse; background-color:#ffffff;">
  <tr>
    <td style="padding:0 0 9px 0;">
      <table cellpadding="0" cellspacing="0" border="0" width="100%" style="display:inline-block; vertical-align:middle; width:100%; max-width:372px; min-width:270px; border-collapse:collapse;"><tr><td style="padding:24px 10px 3px 24px;">${infoBlock(d)}</td></tr></table><table cellpadding="0" cellspacing="0" border="0" width="100%" style="display:inline-block; vertical-align:middle; width:100%; max-width:212px; border-collapse:collapse;"><tr><td align="center" style="padding:17px 24px 10px 16px;">${logoBlock(forPreview)}</td></tr></table>
    </td>
  </tr>
  <tr><td style="padding:0;">${addressBar()}</td></tr>
</table>`;
  }

  const fields = ["name", "title", "email", "phone1", "phone2"];
  let data = {}, mobile = false;

  function readData() {
    data = {};
    fields.forEach(f => data[f] = $(f).value);
  }
  const currentHtml = () => buildSignature(data, false);   // 複製／輸出：絕對網址
  const previewHtml = () => buildSignature(data, true);    // 畫面預覽：相對路徑

  function applyLang() {
    const t = T();
    document.documentElement.lang = t.htmlLang;
    document.title = t.docTitle;
    $("t-title").textContent = t.title;
    $("t-sub").textContent = t.sub;
    $("t-formHead").textContent = t.formHead;
    $("t-lblName").textContent = t.name;
    $("t-lblTitle").textContent = t.jobTitle;
    $("t-lblEmail").textContent = t.email;
    $("t-lblPhone1").textContent = t.phone1;
    $("t-lblPhone2").innerHTML = esc(t.phone2) + ' <span class="hint">' + esc(t.optional) + '</span>';
    $("t-prevHead").textContent = t.prevHead;
    $("viewDesktop").textContent = t.desktop;
    $("viewMobile").textContent = t.mobile;
    $("copyRich").textContent = t.copyRich;
    $("copyCode").textContent = t.copyCode;
    $("t-step1").textContent = t.step1;
    $("t-step2").textContent = t.step2;
    $("t-step3").textContent = t.step3;
    document.querySelectorAll(".lang button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("status").textContent = "";
  }

  function setLang(code) {
    if (!I18N[code]) return;
    lang = code;
    try { localStorage.setItem("sig-lang", code); } catch (e) { /* 無痕模式略過 */ }
    applyLang();
    showQuip(); // 台詞跟著介面語言走
  }

  function render() {
    readData();
    $("stage").className = mobile ? "mobile" : "";
    $("stage").style.width = mobile ? "360px" : "100%";
    $("viewMobile").setAttribute("aria-pressed", String(mobile));
    $("viewDesktop").setAttribute("aria-pressed", String(!mobile));
    $("preview").innerHTML = previewHtml();
  }

  function flash(msg) {
    $("status").textContent = msg;
    clearTimeout(flash.t);
    flash.t = setTimeout(() => $("status").textContent = "", 3000);
  }

  function copyBySelection() {
    const range = document.createRange();
    range.selectNode($("preview"));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand("copy");
    sel.removeAllRanges();
    return ok;
  }

  $("copyRich").addEventListener("click", async () => {
    const html = currentHtml();
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([$("preview").innerText], { type: "text/plain" })
        })]);
        flash(T().okRich);
        return;
      }
    } catch (e) { /* 改用備援做法 */ }
    flash(copyBySelection() ? T().okRich : T().failRich);
  });

  $("copyCode").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(currentHtml());
      flash(T().okCode);
    } catch (e) {
      flash(T().failCode);
    }
  });

  document.querySelectorAll(".lang button").forEach(b =>
    b.addEventListener("click", () => setLang(b.dataset.lang)));
  $("viewDesktop").addEventListener("click", () => { mobile = false; render(); });
  $("viewMobile").addEventListener("click", () => { mobile = true; render(); });
  fields.forEach(f => $(f).addEventListener("input", render));

  // 記住上次選的語言，沒有紀錄時用預設的英文
  let saved = null;
  try { saved = localStorage.getItem("sig-lang"); } catch (e) { /* 無痕模式略過 */ }
  lang = I18N[saved] ? saved : DEFAULT_LANG;
  applyLang();
  render();

  // 讀出 Logo 的真實寬高比，讓輸出的 height 屬性永遠正確；載入失敗則沿用後備值。
  const probe = new Image();
  probe.onload = () => {
    if (probe.naturalWidth > 0) {
      COMPANY.logoRatio = probe.naturalHeight / probe.naturalWidth;
      render();
    }
  };
  probe.src = logoUrl(true);

  // ===================================================================
  // 額外功能：報時台詞
  // 時間來自 timeapi.io，台詞由 Chrome 內建 AI（Gemini Nano）產生。
  // 任何一步失敗都靜默略過，畫面上完全不顯示。
  // ===================================================================
  const QUIP_TIME_URL = "https://timeapi.io/api/Time/current/zone?timeZone=Asia/Taipei";
  const QUIP_TIME_TTL = 60000; // 時間快取 60 秒，避免切語言時重複打 API
  const QUIP_TIMEOUT  = 6000;

  // 英文版由程式隨機挑一個雙關點子餵給模型
  const PUN_IDEAS = [
    "second (unit of time / a moment to spare)",
    "tock sounds like talk",
    "hands (of a clock / helping hands)",
    "wound up (clock spring / tense)",
    "time flies (passes quickly / insects called time flies)",
    "watch (a timepiece / to look at)",
    "face (of a clock / a person's face)",
    "alarmed (alarm clock / startled)",
    "minute (sixty seconds / very tiny)",
    "killing time (wasting time / a crime against the clock)",
    "overtime (extra work hours / over the clock)",
    "on the dot (exactly on time / a small spot)"
  ];

  const pad2 = (n) => String(n).padStart(2, "0");
  const hhmm = (t) => pad2(t.h) + ":" + pad2(t.m);
  const ampm = (t) => (t.h % 12 === 0 ? 12 : t.h % 12) + ":" + pad2(t.m) + (t.h < 12 ? " a.m." : " p.m.");
  const hasHan = (s) => /[一-鿿]/.test(s);
  const hanCount = (s) => Array.from(s.replace(/\s+/g, "")).length;
  const wordCount = (s) => s.trim().split(/\s+/).filter(Boolean).length;

  // 共同清理：去頭尾引號、把換行壓成空格
  function tidy(s) {
    return String(s == null ? "" : s)
      .replace(/\s*[\r\n]+\s*/g, " ")
      .trim()
      .replace(/^[“”"'「」『』]+/, "")
      .replace(/[“”"'「」『』]+$/, "")
      .trim();
  }

  const ZH_BAD = /哈哈|笑點|笑点|冷笑話|冷笑话|這個笑話|这个笑话|很好笑|開玩笑|开玩笑/;
  const EN_BAD = /\b(haha|lol|get it|pun intended|just kidding)\b/i;

  const QUIP_SPEC = {
    "zh-Hant": {
      system: "你負責報時，順便講一個不好笑的反笑話：鋪陳像笑話，答案卻是理所當然的廢話。\n" +
              "每次收到一個時間，就用一問一答，或一句陳述加一句廢話結尾。語氣平淡。\n" +
              "繁體中文，35 字以內，只輸出笑話本身。",
      examples: [
        ["11:14", "現在十一點十四分。再過四十六分鐘就是十二點。不客氣。"],
        ["07:30", "為什麼七點半要起床？因為八點起床會遲到。"],
        ["15:00", "下午三點最適合做什麼？做三點該做的事。"],
        ["23:50", "為什麼快十二點了還不睡？因為還沒睡著。"]
      ],
      buildInput: (t) => hhmm(t),
      clean: (s) => tidy(s).replace(/[!！]/g, "。"),
      valid: (s) => hasHan(s) && hanCount(s) >= 8 && hanCount(s) <= 45 &&
                    !s.includes("｜") && !ZH_BAD.test(s)
    },
    "zh-Hans": {
      system: "你负责报时，顺便讲一个不好笑的反笑话：铺陈像笑话，答案却是理所当然的废话。\n" +
              "每次收到一个时间，就用一问一答，或一句陈述加一句废话结尾。语气平淡。\n" +
              "简体中文，35 字以内，只输出笑话本身。",
      examples: [
        ["11:14", "现在十一点十四分。再过四十六分钟就是十二点。不客气。"],
        ["07:30", "为什么七点半要起床？因为八点起床会迟到。"],
        ["15:00", "下午三点最适合做什么？做三点该做的事。"],
        ["23:50", "为什么快十二点了还不睡？因为还没睡着。"]
      ],
      buildInput: (t) => hhmm(t),
      clean: (s) => tidy(s).replace(/[!！]/g, "。"),
      valid: (s) => hasHan(s) && hanCount(s) >= 8 && hanCount(s) <= 45 &&
                    !s.includes("｜") && !ZH_BAD.test(s)
    },
    "en": {
      system: "You announce the time with a short, groan-worthy pun about time or clocks.\n" +
              "Each message gives you a time and a pun idea; turn them into one or two short sentences.\n" +
              "Deadpan tone. Under 25 words. Output only the joke.",
      examples: [
        ["11:14 a.m. | pun: second (unit of time / a moment to spare)",
         "It's 11:14. I'd tell you a joke about time, but you don't have a second."],
        ["9:05 a.m. | pun: tock sounds like talk",
         "It's 9:05. The clock got in trouble this morning. It tocked too much."],
        ["2:30 p.m. | pun: hands (of a clock / helping hands)",
         "It's 2:30. I asked the clock for help. It said its hands were full."],
        ["10:10 p.m. | pun: wound up (clock spring / tense)",
         "It's 10:10 p.m. Don't get too wound up. That's the clock's job."]
      ],
      buildInput: (t) => ampm(t) + " | pun: " + PUN_IDEAS[Math.floor(Math.random() * PUN_IDEAS.length)],
      clean: (s) => tidy(s).replace(/!/g, "."),
      valid: (s) => !hasHan(s) && wordCount(s) >= 5 && wordCount(s) <= 30 &&
                    !s.includes("|") && !/pun:/i.test(s) && !EN_BAD.test(s)
    }
  };

  // Chrome 內建 AI 的進入點，新舊版命名都試
  function getLanguageModel() {
    if (typeof LanguageModel !== "undefined" && LanguageModel) return LanguageModel;
    if (self.LanguageModel) return self.LanguageModel;
    if (self.ai && self.ai.languageModel) return self.ai.languageModel;
    return null;
  }

  // 模型狀態："ready" 已就緒、"download" 需要下載或下載中、"no" 不支援
  async function modelState(LM) {
    try {
      if (typeof LM.availability === "function") {
        const a = await LM.availability();
        if (a === "available") return "ready";
        if (a === "downloadable" || a === "downloading") return "download";
        return "no";
      }
      if (typeof LM.capabilities === "function") {
        const c = await LM.capabilities();
        if (c && c.available === "readily") return "ready";
        if (c && c.available === "after-download") return "download";
      }
    } catch (e) { /* 視為不可用 */ }
    return "no";
  }

  // Chrome 規定：模型需要下載時，create() 必須在使用者操作（點擊、按鍵）之後才能呼叫。
  // 所以等使用者第一次和頁面互動，再開始下載。
  let gesturePromise = null;
  function firstUserGesture() {
    if (!gesturePromise) {
      gesturePromise = new Promise((resolve) => {
        const done = () => {
          ["pointerdown", "keydown", "touchstart"].forEach(ev =>
            window.removeEventListener(ev, done, true));
          resolve();
        };
        ["pointerdown", "keydown", "touchstart"].forEach(ev =>
          window.addEventListener(ev, done, true));
      });
    }
    return gesturePromise;
  }

  // 主動下載模型：create() 會等下載完成才回傳。下載進度不顯示，完成前台詞維持隱藏。
  let downloadPromise = null;
  function ensureModelDownloaded(LM) {
    if (!downloadPromise) {
      downloadPromise = firstUserGesture()
        .then(() => LM.create({ monitor(m) { m.addEventListener("downloadprogress", () => {}); } }))
        .then((s) => { try { s.destroy(); } catch (e) {} return true; })
        .catch(() => { downloadPromise = null; return false; }); // 失敗允許下次互動再試
    }
    return downloadPromise;
  }

  // 每次都開新的 session：只含系統提示與範例，不累積先前輸出
  async function newSession(LM, spec) {
    const initialPrompts = [{ role: "system", content: spec.system }];
    spec.examples.forEach(([u, a]) => {
      initialPrompts.push({ role: "user", content: u });
      initialPrompts.push({ role: "assistant", content: a });
    });
    try {
      return await LM.create({ initialPrompts });
    } catch (e) {
      // 舊版 API：system 角色不支援，要改用 systemPrompt 參數
      return await LM.create({ systemPrompt: spec.system, initialPrompts: initialPrompts.slice(1) });
    }
  }

  // timeapi.io 目前回傳 hour / minute，另有 time ("HH:MM") 與 dateTime 兩個欄位。
  // 三種都接受，任何一種能解析出合理的時分就算成功。
  function parseTime(j) {
    const ok = (h, m) => Number.isInteger(h) && Number.isInteger(m) &&
                         h >= 0 && h <= 23 && m >= 0 && m <= 59 ? { h, m } : null;
    if (j && typeof j === "object") {
      const direct = ok(Number(j.hour), Number(j.minute));
      if (direct) return direct;
      for (const field of [j.time, j.dateTime]) {
        const hit = typeof field === "string" && field.match(/(\d{1,2}):(\d{2})/);
        if (hit) {
          const parsed = ok(Number(hit[1]), Number(hit[2]));
          if (parsed) return parsed;
        }
      }
    }
    return null;
  }

  let timeCache = null;
  async function taipeiTime() {
    if (timeCache && Date.now() - timeCache.at < QUIP_TIME_TTL) return timeCache.value;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), QUIP_TIMEOUT);
    try {
      const res = await fetch(QUIP_TIME_URL, { signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) return null;
      const value = parseTime(await res.json());
      if (!value) return null;
      timeCache = { value, at: Date.now() };
      return value;
    } catch (e) {
      return null; // 離線、CORS、逾時等
    } finally {
      clearTimeout(timer);
    }
  }

  async function makeQuip(code) {
    const spec = QUIP_SPEC[code];
    if (!spec) return null;

    const LM = getLanguageModel();
    if (!LM) return null;                       // 沒有瀏覽器 AI
    const state = await modelState(LM);
    if (state === "no") return null;            // 裝置不支援
    if (state === "download" && !(await ensureModelDownloaded(LM))) return null; // 下載失敗

    const t = await taipeiTime();                // 下載完才抓時間，避免時間過期
    if (!t) return null;                        // 時間 API 失敗

    const input = spec.buildInput(t);
    for (let attempt = 0; attempt < 2; attempt++) {  // 不合格就重新生成一次
      let session = null;
      try {
        session = await newSession(LM, spec);
        const text = spec.clean(await session.prompt(input));
        if (spec.valid(text)) return text;
      } catch (e) {
        return null;                            // 生成過程出錯 → 不顯示
      } finally {
        try { if (session && session.destroy) session.destroy(); } catch (e) {}
      }
    }
    return null;                                // 兩次都不合格 → 不顯示
  }

  let quipToken = 0;
  const quipCache = {};

  function hideQuip() {
    const el = $("quip");
    el.hidden = true;
    el.textContent = "";
  }

  async function showQuip() {
    const code = lang;
    const mine = ++quipToken;
    hideQuip();

    let text = quipCache[code];
    if (!text) {
      try { text = await makeQuip(code); } catch (e) { text = null; }
    }
    if (mine !== quipToken) return;             // 期間切換過語言就放棄這次結果
    if (!text) return;                          // 任何失敗都不顯示

    quipCache[code] = text;
    const el = $("quip");
    el.textContent = text;
    el.hidden = false;
  }

  showQuip();
</script>
</body>
</html>
